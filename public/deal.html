<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Brand Deal — Milk &amp; Honey Sports</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: #0a0a0a; font-family: -apple-system,'SF Pro Display','Helvetica Neue',sans-serif; min-height: 100vh; color: #f0f0f0; }
    .shell { max-width: 480px; margin: 0 auto; padding: 0 20px 80px; }
    .hdr { padding: 32px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .hdr img { height: 34px; }
    .card { background: #111; border: 1.5px solid #1e1e1e; border-radius: 18px; padding: 24px 20px; margin-top: 18px; animation: fadeUp .25s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .eyebrow { font-size: 10px; font-weight: 700; color: #5BC898; text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 8px; }
    .brand { font-size: 27px; font-weight: 800; color: #fff; letter-spacing: -0.025em; line-height: 1.1; }
    .for { font-size: 13px; color: #888; margin-top: 6px; }
    .for b { color: #f0f0f0; font-weight: 700; }
    .sec { margin-top: 22px; }
    .sec-label { font-size: 10px; font-weight: 700; color: #777; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .sec-body { font-size: 14px; color: #ddd; line-height: 1.55; white-space: pre-line; }
    .value { color: #5BC898; font-weight: 700; }
    .deadline { font-size: 12px; color: #b9924d; margin-top: 18px; }
    .opt { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: #0d0d0d; border: 1.5px solid #222; border-radius: 12px; cursor: pointer; margin-bottom: 8px; transition: border-color .15s; }
    .opt.on { border-color: #5BC898; background: rgba(91,200,152,0.07); }
    .opt-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #444; flex-shrink: 0; }
    .opt.on .opt-dot { border-color: #5BC898; background: radial-gradient(circle at center, #5BC898 45%, transparent 50%); }
    .opt-name { font-size: 14px; color: #eee; font-weight: 600; }
    .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .more-btn { width: 100%; margin-top: 10px; padding: 12px; background: transparent; border: 1.5px dashed #2a2a2a; border-radius: 12px; color: #999; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
    .pick-sum { font-size: 12px; color: #888; margin-bottom: 10px; }
    .pick-note { font-size: 11px; color: #666; margin-top: 12px; margin-bottom: 6px; text-align: center; }
    a.more-btn { display: block; text-align: center; text-decoration: none; color: #5BC898; border-color: #2b4437; }
    .pick-sum b { color: #5BC898; }
    .pcard { border: 1.5px solid #222; border-radius: 14px; overflow: hidden; cursor: pointer; background: #0d0d0d; transition: border-color .15s; position: relative; }
    .pcard.on { border-color: #5BC898; }
    .pcard .chk { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: #5BC898; color: #08130d; font-size: 13px; font-weight: 800; display: none; align-items: center; justify-content: center; }
    .pcard.on .chk { display: flex; }
    .pcard img, .pcard .pimg { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #161616; }
    .pcard .pimg { display: flex; align-items: center; justify-content: center; color: #333; font-size: 26px; }
    .pcard .pn { padding: 9px 10px 2px; font-size: 12.5px; font-weight: 600; color: #eee; line-height: 1.35; }
    .pcard .pp { padding: 0 10px 10px; font-size: 11.5px; color: #5BC898; font-weight: 700; min-height: 21px; }
    input[type=text] { width: 100%; padding: 14px 16px; background: #0d0d0d; border: 1.5px solid #222; border-radius: 12px; color: #f0f0f0; font-size: 16px; font-family: inherit; outline: none; }
    input[type=text]:focus { border-color: #5BC898; }
    input::placeholder { color: #444; }
    .sig-note { font-size: 11px; color: #666; margin-top: 6px; }
    .agree { display: flex; gap: 11px; align-items: flex-start; margin-top: 16px; cursor: pointer; }
    .agree input { width: 17px; height: 17px; margin-top: 1px; accent-color: #5BC898; flex-shrink: 0; }
    .agree span { font-size: 12.5px; color: #999; line-height: 1.5; }
    .btn { width: 100%; margin-top: 20px; padding: 15px; background: #5BC898; border: none; border-radius: 13px; color: #08130d; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; transition: opacity .15s; }
    .btn:disabled { background: #1c1c1c; color: #555; cursor: default; }
    .err { color: #e5726c; font-size: 13px; margin-top: 12px; text-align: center; }
    .center { text-align: center; padding: 36px 0 16px; }
    .big-icon { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; background: rgba(91,200,152,0.12); color: #5BC898; font-size: 26px; }
    .big-icon.dim { background: #1a1a1a; color: #666; }
    .center h2 { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .center p { font-size: 13.5px; color: #888; margin-top: 8px; line-height: 1.55; }
    .foot { text-align: center; font-size: 11px; color: #444; margin-top: 26px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hdr"><img src="/mh-logo.png" alt="Milk &amp; Honey" onerror="this.style.display='none'" /></div>
    <div id="root"><div class="card"><div class="center"><p>Loading…</p></div></div></div>
    <div class="foot">Milk &amp; Honey Sports</div>
  </div>
<script>
(function () {
  var root = document.getElementById('root');
  var m = location.pathname.match(/\/deal\/([A-Za-z0-9_-]+)/);
  var token = m ? m[1] : new URLSearchParams(location.search).get('t') || '';
  var esc = function (s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; };
  var state = { info: null, picked: [], pickTexts: [''], name: '', agree: false, busy: false, err: '', showAll: false };
  function filledTexts() { return state.pickTexts.map(function (t) { return t.trim(); }).filter(Boolean); }
  // One paste input per remaining pick: filled slots stay, and while capacity
  // remains one empty slot follows (another appears as each one is used).
  function pickInputsHtml(i, placeholder) {
    var maxN = i.pickBudget ? Infinity : (i.pickCount || 1);
    var slots = filledTexts();
    if (state.picked.length + slots.length < maxN) slots = slots.concat(['']);
    return slots.map(function (v, k) {
      return '<input type="text" class="picktext" placeholder="' + placeholder + '" value="' + esc(v) + '"' + (k > 0 ? ' style="margin-top:8px"' : '') + ' />';
    }).join('');
  }

  function message(icon, dim, title, body) {
    root.innerHTML = '<div class="card"><div class="center"><div class="big-icon' + (dim ? ' dim' : '') + '">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(body) + '</p></div></div>';
  }

  function priceOf(card) { var n = parseFloat(String(card.price || '').replace(/[^0-9.]/g, '')); return isFinite(n) ? n : 0; }
  function pickedTotal(cards) {
    var t = 0;
    state.picked.forEach(function (title) { var c = cards.filter(function (x) { return x.title === title; })[0]; if (c) t += priceOf(c); });
    return t;
  }
  function togglePick(card, i) {
    var idx = state.picked.indexOf(card.title);
    if (idx >= 0) { state.picked.splice(idx, 1); render(); return; }
    var maxN = i.pickBudget ? Infinity : (i.pickCount || 1);
    if (maxN === 1) { state.picked = [card.title]; state.pickTexts = ['']; render(); return; }
    if (state.picked.length + filledTexts().length >= maxN) return; // at the count limit
    if (i.pickBudget && pickedTotal(i.productCards || []) + priceOf(card) > i.pickBudget) {
      state.err = 'That would put you over the $' + i.pickBudget + ' limit.'; render(); return;
    }
    state.err = '';
    state.picked.push(card.title);
    render();
  }

  function fmtDate(s) {
    var d = new Date(s + 'T12:00:00');
    return isNaN(d) ? s : d.toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
  }

  function render() {
    var i = state.info;
    var needsPick = i.dealType !== 'cash' && (((i.productCards || []).length) || i.products.length);
    var hasPick = state.picked.length || filledTexts().length;
    var canSign = state.name.trim() && state.agree && (!needsPick || hasPick) && !state.busy;
    var html = '<div class="card">' +
      '<div class="eyebrow">Brand deal</div>' +
      '<div class="brand">' + esc(i.company) + '</div>' +
      (i.generic ? '<div class="for">For Milk &amp; Honey clients</div>' : '<div class="for">For <b>' + esc(i.player) + '</b> \u00b7 via Milk &amp; Honey Sports</div>');
    if (i.deliverables) html += '<div class="sec"><div class="sec-label">Deal terms</div><div class="sec-body">' + esc(i.deliverables) + '</div></div>';
    var allCards = i.productCards || [];
    var browseCards = allCards.filter(function (c) { return c.browse; });
    var cards = allCards.filter(function (c) { return !c.browse; });
    var maxN = i.pickBudget ? 0 : (i.pickCount || 1);
    var offer = i.dealType === 'cash' ? i.value : (i.value || (cards.length || i.products.length
      ? (cards.length === 1 ? 'Free product'
        : i.pickBudget ? 'Free product \u2014 pick up to $' + i.pickBudget + ' worth below'
        : maxN > 1 ? 'Free product \u2014 pick up to ' + maxN + ' below'
        : 'Free product \u2014 pick one below') : ''));
    if (offer) html += '<div class="sec"><div class="sec-label">Offer</div><div class="sec-body value">' + esc(offer) + '</div></div>';
    var single = cards.length === 1;
    if (cards.length) {
      var visible = state.showAll ? cards : cards.slice(0, 4);
      var sum = '';
      if (single) sum = '';
      else if (i.pickBudget) sum = 'Selected <b>$' + pickedTotal(cards) + '</b> of your $' + i.pickBudget + ' limit';
      else if (maxN > 1) sum = 'Selected <b>' + (state.picked.length + filledTexts().length) + '</b> of up to ' + maxN;
      html += '<div class="sec"><div class="sec-label">' + (i.collectionName ? esc(i.collectionName) : single ? 'Your product' : 'Products') + '</div>' +
        (sum ? '<div class="pick-sum">' + sum + '</div>' : '') +
        '<div class="pgrid">' + visible.map(function (p, j) {
        return '<div class="pcard' + (state.picked.indexOf(p.title) >= 0 ? ' on' : '') + '" data-p="' + j + '">' +
          '<div class="chk">\u2713</div>' +
          (p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=pimg>\u25A1</div>\'" />' : '<div class="pimg">\u25A1</div>') +
          '<div class="pn">' + esc(p.title) + '</div>' +
          '<div class="pp">' + esc(p.price || '') + '</div></div>';
      }).join('') + '</div>' +
        (cards.length > 4 && !state.showAll ? '<button class="more-btn" id="more">View more</button>' : '') +
        (function () {
          var site = '';
          try { site = new URL((cards[0] || {}).url || i.products[0]).origin; } catch (e) { /* no usable link */ }
          var inputs = pickInputsHtml(i, 'Paste product link here');
          return (site ? '<a class="more-btn" href="' + esc(site) + '" target="_blank" rel="noreferrer">' + esc(i.company) + '\u2019s full catalog \u2197</a>' : '') +
            (inputs ? '<div class="pick-note">Paste product link below if it\u2019s not available to select above.</div><div id="pickinputs">' + inputs + '</div>' : '');
        })() +
        '</div>';
    }

    if (browseCards.length) {
      html += '<div class="sec"><div class="sec-label">' + (cards.length ? 'Or pick from the collection' : 'Pick from the collection') + '</div>' +
        browseCards.map(function (c) {
          return '<a class="opt" style="text-decoration:none" href="' + esc(c.url) + '" target="_blank" rel="noreferrer"><div class="opt-name" style="color:#5BC898">' + esc(c.title) + ' \u2197</div></a>';
        }).join('') +
        '<div id="pickinputs" style="margin-top:8px">' + pickInputsHtml(i, 'Type the exact product you want from the collection') + '</div>' +
        '</div>';
    }
    if (!cards.length && !browseCards.length && i.dealType !== 'cash' && i.products.length) {
      html += '<div class="sec"><div class="sec-label">Pick your product</div>' + i.products.map(function (p, j) {
        return '<div class="opt' + (state.picked.indexOf(p) >= 0 ? ' on' : '') + '" data-p="' + j + '"><div class="opt-dot"></div><div class="opt-name">' + esc(p) + '</div></div>';
      }).join('') + '</div>';
    }
    if (i.expires) html += '<div class="deadline">Respond by ' + esc(fmtDate(i.expires)) + '</div>';
    html += '<div class="sec"><div class="sec-label">Sign to accept</div>' +
      '<input type="text" id="sig" autocomplete="name" placeholder="Type your full name" value="' + esc(state.name) + '" />' +

      '<label class="agree"><input type="checkbox" id="agree"' + (state.agree ? ' checked' : '') + ' /><span>By checking this box I agree to complete the deliverables outlined above in exchange for my selected goods.</span></label>' +
      '<button class="btn" id="go"' + (canSign ? '' : ' disabled') + '>' + (state.busy ? 'Signing\u2026' : 'Count me in') + '</button>' +
      (state.err ? '<div class="err">' + esc(state.err) + '</div>' : '') +
      '</div></div>';
    root.innerHTML = html;

    Array.prototype.forEach.call(root.querySelectorAll('.pcard'), function (el) {
      el.onclick = function () {
        if ((i.productCards || []).length === 1) return; // single product — nothing to choose
        var visible = state.showAll ? (i.productCards || []) : (i.productCards || []).slice(0, 4);
        var card = visible[+el.getAttribute('data-p')];
        if (card) togglePick(card, i);
      };
    });
    var more = document.getElementById('more');
    if (more) more.onclick = function () { state.showAll = true; render(); };
    Array.prototype.forEach.call(root.querySelectorAll('.opt'), function (el) {
      el.onclick = function () { togglePick({ title: i.products[+el.getAttribute('data-p')], price: '' }, i); };
    });
    var sig = document.getElementById('sig');
    var recheck = function () { document.getElementById('go').disabled = !(state.name.trim() && state.agree && (!needsPick || state.picked.length || filledTexts().length)); };
    sig.oninput = function () { state.name = sig.value; recheck(); };
    var bindPicks = function () {
      Array.prototype.forEach.call(root.querySelectorAll('.picktext'), function (el) {
        el.oninput = function () {
          state.pickTexts = Array.prototype.map.call(root.querySelectorAll('.picktext'), function (x) { return x.value; });
          var realCards = (i.productCards || []).filter(function (c) { return !c.browse; });
          var maxN = i.pickBudget ? Infinity : (i.pickCount || 1);
          var filled = filledTexts();
          // On 1-pick deals a pasted link replaces the card choice (and the
          // preset card comes back if they clear the paste).
          if (maxN === 1) state.picked = filled.length ? [] : (realCards.length === 1 ? [realCards[0].title] : state.picked);
          recheck();
          var inputs = root.querySelectorAll('.picktext');
          var last = inputs[inputs.length - 1];
          if (last === el && el.value.trim() && state.picked.length + filled.length < maxN) {
            var ni = el.cloneNode(false);
            ni.value = '';
            ni.style.marginTop = '8px';
            el.parentNode.appendChild(ni);
            state.pickTexts.push('');
            bindPicks();
          }
        };
      });
    };
    bindPicks();
    document.getElementById('agree').onchange = function (e) { state.agree = e.target.checked; render(); };
    document.getElementById('go').onclick = sign;
  }

  function sign() {
    if (state.busy) return;
    var i = state.info;
    var maxN = i.pickBudget ? Infinity : (i.pickCount || 1);
    var total = state.picked.length + filledTexts().length;
    if (i.dealType !== 'cash' && isFinite(maxN) && total > maxN) {
      state.err = 'That\u2019s ' + total + ' picks \u2014 this deal allows up to ' + maxN + ' (pasted links count too).';
      render();
      return;
    }
    state.busy = true; state.err = ''; render();
    fetch('/api/deal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, product: state.picked.concat(filledTexts()).join(' + '), signature: state.name.trim() }),
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { state.busy = false; state.err = res.j.error || 'Something went wrong \u2014 try again.'; render(); return; }
        message('\u2713', false, 'You\u2019re in!', 'Your team at Milk & Honey has been notified' + (state.picked.length ? ' \u2014 you picked ' + state.picked.map(function (t) { return '\u201C' + t + '\u201D'; }).join(', ') : '') + '. They\u2019ll follow up with next steps.');
      })
      .catch(function () { state.busy = false; state.err = 'Network error \u2014 try again.'; render(); });
  }

  if (!token) { message('?', true, 'Link not valid', 'This deal link is incomplete. Ask your agent to resend it.'); return; }
  fetch('/api/deal?token=' + encodeURIComponent(token))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) return message('?', true, 'Link not valid', 'This deal link doesn’t work. Ask your agent to resend it.');
      var i = res.j;
      if (i.signed) return message('✓', false, 'Already signed', 'You signed up for the ' + i.company + ' deal' + (i.product ? ' and picked “' + i.product + '”' : '') + '. Your team will follow up with next steps.');
      if (i.expired) return message('⏰', true, 'This deal has closed', 'The window to sign up for the ' + i.company + ' deal has passed. Ask your agent about upcoming deals.');
      if (i.player && i.company) document.title = i.player + ' \u2014 Brand Deal Offer from ' + i.company;
      if ((i.productCards || []).length === 1) state.picked = [i.productCards[0].title];
      state.info = i;
      render();
    })
    .catch(function () { message('!', true, 'Connection problem', 'Could not load this deal. Check your connection and refresh.'); });
})();
</script>
</body>
</html>
